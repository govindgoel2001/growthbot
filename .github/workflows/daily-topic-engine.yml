name: daily-topic-engine

# Every morning, surface trending AI repos and turn them into ready-to-shoot
# scripts, then commit the shot-list back to the repo. A fresh output/<date>.md
# is waiting for you each day.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (10:30 IST). Cron is always UTC.
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Generate today's shot-list
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: python scripts/topic_engine.py --count 6 --days 14

      - name: Commit shot-list
        run: |
          git config user.name "growthbot"
          git config user.email "growthbot@users.noreply.github.com"
          git add scripts/output/ || true
          git commit -m "shot-list: $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"
